[project]
name = "classroom-ai"
version = "0.0.0"
description = "A school's own GPUs as a private chat service for students"
license = "MIT"
requires-python = "==3.14.*"
dependencies = [
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "worker/tests"]
pythonpath = ["worker"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

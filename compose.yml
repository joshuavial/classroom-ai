# The server stack. Run scripts/init-env.sh once first to create .env.
services:
  caddy:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    # BIND_ADDRESS is 127.0.0.1 in development and 0.0.0.0 on a school
    # server, so lab PCs can reach it. compose.https.yml adds 443.
    # HTTP_PORT lets a second stack on one machine use another host port.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
    environment:
      # No SERVER_NAME (development): plain HTTP on port 80.
      SITE_ADDRESS: ${SERVER_NAME:-:80}
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
    depends_on: [app, web]

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?run scripts/init-env.sh first}
      GUARD_URL: http://guard:8080
    networks: [edge, internal]
    depends_on:
      db:
        condition: service_healthy

  guard-model-download:
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        file=/models/Qwen3Guard-Gen-0.6B.Q8_0.gguf
        hash=127e8833aa16c6839613cd08df5409440302e8c61e90617914b3100f2141411a
        if [ -f "$$file" ] && echo "$$hash  $$file" | sha256sum -c -; then exit 0; fi
        curl --fail --location --retry 3 --output "$$file.tmp" https://huggingface.co/mradermacher/Qwen3Guard-Gen-0.6B-GGUF/resolve/2a59799e089fba3807d534a89c6b95bdf38ee76a/Qwen3Guard-Gen-0.6B.Q8_0.gguf
        echo "$$hash  $$file.tmp" | sha256sum -c -
        mv -f "$$file.tmp" "$$file"
    volumes:
      - guard_models:/models
    networks: [model-download]

  guard:
    image: ghcr.io/ggml-org/llama.cpp:server-b11434@sha256:af8c29600d1de84945de13fa7f126d06fdae16c4b19dc7db1c69c74287eae257
    restart: unless-stopped
    depends_on:
      guard-model-download:
        condition: service_completed_successfully
    command:
      - -lv
      - "4"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/Qwen3Guard-Gen-0.6B.Q8_0.gguf
      - --alias
      - qwen3guard-0.6b
      - --threads
      - "${GUARD_THREADS:-8}"
      - --parallel
      - "${GUARD_PARALLEL:-30}"
      - --kv-unified-per-slot
      - "4096"
      - --cache-type-k
      - "${GUARD_CACHE_K:-f16}"
      - --cache-type-v
      - "${GUARD_CACHE_V:-f16}"
      - --n-gpu-layers
      - "0"
      - --jinja
      - --no-prefill-assistant
      - --cache-ram
      - "${GUARD_CACHE_RAM:-0}"
    volumes:
      - guard_models:/models:ro
    networks: [internal]

  web:
    build: web
    restart: unless-stopped
    networks: [edge]

  db:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      # TCP on 127.0.0.1 only answers once the real server is up, not the
      # temporary one the image runs during first-time init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  edge: {}
  internal:
    internal: true
  model-download: {}

volumes:
  pgdata: {}
  caddy_data: {}
  guard_models: {}
